<!-- [index.html] -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Discord Hub</title>
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; cursor: pointer; display: inline-block; width: 250px; margin: 10px; }
    .card:hover { border-color: #58a6ff; }
    .badge { padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.8em; }
    .on { background: rgba(63,185,80,0.15); color: #3fb950; border: 1px solid #3fb950; }
    .off { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid #f85149; }
    
    /* 📌 공지사항 배너 스타일 */
    .notice-banner { background: #d29922; color: #000; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 20px; display: none; }
    
    .terminal { background: #000; border: 1px solid #30363d; border-radius: 6px; padding: 15px; height: 350px; font-family: monospace; overflow-y: auto; }
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; }
    .modal-box { background: #161b22; padding: 30px; border-radius: 8px; text-align:center; border: 1px solid #30363d; }
    input[type=password] { padding: 10px; text-align: center; letter-spacing: 5px; background:#0d1117; color:#fff; border:1px solid #30363d; margin-bottom:10px;}
    button { padding: 8px 15px; background: #58a6ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div id="listView">
  <h1>Discord Bot Hub</h1>
  <button onclick="loadBots()">목록 새로고침</button>
  <div id="botGrid" style="margin-top:20px;"></div>
</div>

<div id="dashView" style="display:none; max-width: 900px; margin: 0 auto;">
  <button onclick="goBack()" style="background:#21262d; border:1px solid #30363d; margin-bottom:15px;">← 뒤로가기</button>
  
  <!-- 공지사항 렌더링 영역 -->
  <div id="dashNotice" class="notice-banner">📢 [공지] 여기에 공지가 표시됩니다.</div>
  
  <h2 id="dashTitle" style="display:inline-block;">Bot Name</h2>
  <span id="dashBadge" class="badge"></span>
  <div style="display:flex; gap:15px; margin:15px 0;">
    <div style="flex:1; background:#161b22; padding:15px; border-radius:6px;">CPU: <b id="dashCpu" style="color:#58a6ff; font-size:1.5em;">0%</b></div>
    <div style="flex:1; background:#161b22; padding:15px; border-radius:6px;">RAM: <b id="dashRam" style="color:#58a6ff; font-size:1.5em;">0MB</b></div>
  </div>
  <div id="terminal" class="terminal"></div>
</div>

<div id="pinModal" class="modal">
  <div class="modal-box">
    <h3>봇 접속 PIN</h3>
    <input type="password" id="pinInput" maxlength="4" placeholder="••••"><br>
    <button onclick="verifyPin()">확인</button> <button onclick="closeModal()" style="background:#30363d;">취소</button>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwuiQp7a1dXsCVdFIMWWhUS49CY0K34DAiEhOlejxOF01visXHMFj1bbzMxmzcZugD0Hg/exec"; // GAS 앱 URL 입력
  let curId = null, curPin = "", timer = null;

  function loadBots() {
    fetch(GAS_URL + "?action=listBots").then(r=>r.json()).then(r => {
      document.getElementById("botGrid").innerHTML = r.bots.map(b => 
        `<div class="card" onclick="openModal('${b.id}')">
          <h3>${b.name}</h3><span class="badge ${b.status==='Running'?'on':'off'}">${b.status}</span>
        </div>`
      ).join('');
    });
  }

  function openModal(id) { curId = id; document.getElementById("pinModal").style.display = "flex"; }
  function closeModal() { document.getElementById("pinModal").style.display = "none"; }

  function verifyPin() {
    curPin = document.getElementById("pinInput").value;
    fetchData(true);
  }

  function fetchData(isInit = false) {
    if(!curId || !curPin) return;
    fetch(`${GAS_URL}?action=getBotData&bot_id=${curId}&pin=${curPin}`)
      .then(r=>r.json()).then(r => {
        if(!r.authenticated) { if(isInit) alert("PIN이 틀렸습니다."); return; }
        if(isInit) { closeModal(); document.getElementById("listView").style.display = "none"; document.getElementById("dashView").style.display = "block"; timer = setInterval(fetchData, 4000); }
        
        // 데이터 및 공지사항 바인딩
        let d = r.data;
        document.getElementById("dashTitle").innerText = d.name;
        document.getElementById("dashBadge").className = `badge ${d.status==='Running'?'on':'off'}`;
        document.getElementById("dashBadge").innerText = d.status;
        document.getElementById("dashCpu").innerText = d.cpu + "%";
        document.getElementById("dashRam").innerText = d.ram + "MB";
        
        // 공지가 있으면 표시, 없으면 숨김
        const noticeDiv = document.getElementById("dashNotice");
        if(d.announcement && d.announcement.trim() !== "") {
          noticeDiv.style.display = "block";
          noticeDiv.innerText = "📢 " + d.announcement;
        } else {
          noticeDiv.style.display = "none";
        }

        // 터미널 렌더링
        const term = document.getElementById("terminal");
        term.innerHTML = d.logs.map(l => `<div>${l}</div>`).join('');
        term.scrollTop = term.scrollHeight;
      });
  }

  function goBack() {
    clearInterval(timer); curPin = ""; curId = null;
    document.getElementById("dashView").style.display = "none";
    document.getElementById("listView").style.display = "block";
  }
  
  window.onload = loadBots;
</script>
</body>
</html>
