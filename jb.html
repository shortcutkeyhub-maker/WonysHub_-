<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문지 배정_분배기</title>
    <style>
        /* 이 폰트가 가장 예쁨 ㅇㅇ */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #ffffff; 
            color: #111111;
            text-align: center;
        }
        .wrapper {
            padding: 0 24px;
            max-width: 500px;
            word-break: keep-all;
        }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 1.125rem;
            color: #666666;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .btn { 
            display: inline-block; 
            padding: 16px 40px; 
            background-color: #111111; 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 999px; /* 알약버튼이 최고임 ㅇㅇ */
            font-size: 1.125rem;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover { background-color: #333333; }
        .btn:active { transform: scale(0.98); }
        
        /* 로딩 스피너 */
        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #111111;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="wrapper" id="app">
        <div class="spinner"></div>
        <h2>설문지 데이터를 확인중입니다.</h2>
        <p>가장 적절한 설문지로 배정 중입니다. 사이트를 이탈하지 마십시오.</p>
    </div>

    <script>
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwQmc7mVUGfVH4mBPDfI-36eGpPmxzW8s6D1F_JYbRnhUWLgs7m9ZERrOgmEt5_qbUD/exec';
        const SURVEY_URLS = {
            'A': 'https://docs.google.com/forms/d/e/1FAIpQLSdqmJtBaZt6Jo5Aql4d28qVs3W4gSDfaG4m6YyBEzzeGzObqA/viewform?usp=publish-editor',
            'B': 'https://docs.google.com/forms/d/e/1FAIpQLSeC3_M1BRjv4UUjlFcBjQ6N7sQCd7sF21Q8Z6_XWKjAO36KBw/viewform?usp=publish-editor'
        };

        async function assignSurvey() {
            const appDiv = document.getElementById('app');

            // 1. 브라우저 로컬 저장소 확인 (재참여 여부 확인)
            const hasParticipated = localStorage.getItem('hasParticipated');
            if (hasParticipated === 'true') {
                const wantToRetry = confirm("이미 설문에 참여하신 기록이 있습니다. 다시 참여하시겠습니까?");
                if (!wantToRetry) {
                    appDiv.innerHTML = `
                        <h2 style="margin-bottom: 8px;">참여가 취소되었습니다</h2>
                        <p>관심 가져주셔서 감사합니다.</p>
                    `;
                    return; // 취소 시 즉시 중단 (서버 통신 차단)
                }
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const response = await fetch(GAS_WEB_APP_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                // 2. HTTP 상태 코드에 따른 세분화 에러 분기
                if (!response.ok) {
                    if (response.status === 403) {
                        window.location.href = 'er.html?err=403';
                        return;
                    } else if (response.status === 404 || response.status === 500) {
                        window.location.href = 'er.html?err=null';
                        return;
                    } else {
                        window.location.href = 'er.html?err=default';
                        return;
                    }
                }

                const data = await response.json();

                // 3. GAS 반환 JSON status값에 따른 er.html 매핑 확장
                if (data.status === 'success') {
                    if (!data.assigned || !SURVEY_URLS[data.assigned]) {
                        // 정상 배정값이 없거나 매핑 실패 시
                        window.location.href = 'er.html?err=null';
                        return;
                    }

                    appDiv.innerHTML = `
                        <h2 style="margin-bottom: 8px;">배정 완료</h2>
                        <p style="color: #111; font-weight: 500;">귀하는 <strong>${data.assigned}형 설문지</strong>에 배정되었습니다.</p>
                        <a href="${SURVEY_URLS[data.assigned]}" class="btn" onclick="markParticipated()">설문 시작하기</a>
                    `;
                } else if (data.status === 'busy' || data.status === '403') {
                    window.location.href = 'er.html?err=403';
                } else if (data.status === 'null' || data.status === 'error' || data.status === 'db_error') {
                    window.location.href = 'er.html?err=null';
                } else if (data.status === 'cors') {
                    window.location.href = 'er.html?err=cors';
                } else {
                    window.location.href = 'er.html?err=default';
                }

            } catch (error) {
                // 4. 통신 장애, CORS 차단, 타임아웃 예외 처리
                if (error.name === 'AbortError' || error instanceof TypeError) {
                    window.location.href = 'er.html?err=cors';
                } else {
                    window.location.href = 'er.html?err=default';
                }
            }
        }

        // 클릭 시 로컬 스토리지에 참여 완료 기록
        function markParticipated() {
            localStorage.setItem('hasParticipated', 'true');
        }

        window.onload = assignSurvey;
    </script>
</body>
</html>
